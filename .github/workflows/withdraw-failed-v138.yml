name: Withdraw first failed v1.3.8 artifacts

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: withdraw-first-failed-v138
  cancel-in-progress: false

jobs:
  withdraw:
    if: >-
      github.repository == 'mss-boot-io/mss-boot-admin' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'lwnmengjing' &&
      github.triggering_actor == 'lwnmengjing'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out reviewed main cleanup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Withdraw only the original failed artifact identities
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/release/withdraw_failed_v138.py --write
