name: Official npm Release
run-name: Official npm Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Retry publication from this exact Root vX.Y.Z tag
        required: true
        type: string

permissions:
  contents: read

# All versions share one queue: an older rerun may never move latest backward.
concurrency:
  group: official-npm-publication
  cancel-in-progress: false

jobs:
  gate:
    name: require-successful-main-and-tag-workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      npm-version: ${{ steps.identity.outputs.npm-version }}
    steps:
      - name: Require authorized release operator
        env:
          RELEASE_ACTOR_LOGIN: lwnmengjing
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTOR}" != "${RELEASE_ACTOR_LOGIN}" || "${GITHUB_TRIGGERING_ACTOR}" != "${RELEASE_ACTOR_LOGIN}" ]]; then
            echo "release operations must be initiated and triggered by ${RELEASE_ACTOR_LOGIN}" >&2
            exit 1
          fi

      - name: Validate exact root tag identity
        id: identity
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            push|workflow_dispatch) ;;
            *) echo 'npm publication requires a Root tag push or exact-tag retry' >&2; exit 1 ;;
          esac
          test "${GITHUB_REF_TYPE}" = 'tag'
          [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            test "${REQUESTED_VERSION}" = "${GITHUB_REF_NAME}"
          fi
          {
            echo "RELEASE_VERSION=${GITHUB_REF_NAME}"
            echo "RELEASE_COMMIT=${GITHUB_SHA}"
            echo "UNPREFIXED_VERSION=${GITHUB_REF_NAME#v}"
          } >> "${GITHUB_ENV}"
          {
            echo "version=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "npm-version=${GITHUB_REF_NAME#v}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify merged-main release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"
          python3 tools/release/verify_release_source.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${RELEASE_COMMIT}" \
            --tag "${RELEASE_VERSION}" \
            --source-mode promotion \
            --policy .mss/release-policy.yaml
          python3 tools/release/check_release_policy.py \
            --component npm \
            --version "${RELEASE_VERSION}" \
            --tag "@mss-boot-io/admin-web@${UNPREFIXED_VERSION}" \
            --intent publish

      - name: Wait for successful exact-source main and tag workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release/check_release_runs.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${RELEASE_COMMIT}" \
            --version "${RELEASE_VERSION}" \
            --phase all --timeout-seconds 7200 --poll-seconds 30 \
            --output "${RUNNER_TEMP}/release-workflow-evidence.json"

  publish:
    name: publish-existing-admin-web-tarball
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: npm-auto
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
      UNPREFIXED_VERSION: ${{ needs.gate.outputs.npm-version }}
    outputs:
      version: ${{ needs.gate.outputs.version }}
      commit: ${{ needs.gate.outputs.commit }}
    steps:
      - name: Require authorized release operator
        env:
          RELEASE_ACTOR_LOGIN: lwnmengjing
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTOR}" != "${RELEASE_ACTOR_LOGIN}" || "${GITHUB_TRIGGERING_ACTOR}" != "${RELEASE_ACTOR_LOGIN}" ]]; then
            echo "release operations must be initiated and triggered by ${RELEASE_ACTOR_LOGIN}" >&2
            exit 1
          fi

      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false

      - name: Require the exact frontend release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local tag_name="$1"
            local object_type
            local object_sha
            local tag_object
            local depth=0

            tag_object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag_name}")"
            object_type="$(jq -r '.object.type' <<< "${tag_object}")"
            object_sha="$(jq -r '.object.sha' <<< "${tag_object}")"
            while [[ "${object_type}" == 'tag' ]]; do
              depth=$((depth + 1))
              if [[ "${depth}" -gt 5 ]]; then
                echo "tag ${tag_name} has too many annotation levels" >&2
                return 1
              fi
              tag_object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_type="$(jq -r '.object.type' <<< "${tag_object}")"
              object_sha="$(jq -r '.object.sha' <<< "${tag_object}")"
            done
            if [[ "${object_type}" != 'commit' || ! "${object_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "tag ${tag_name} does not resolve to one commit" >&2
              return 1
            fi
            printf '%s\n' "${object_sha}"
          }

          frontend_tag="web/antd-v6/${RELEASE_VERSION}"
          if ! tag_commit="$(resolve_tag_commit "${frontend_tag}" 2>/dev/null)"; then
            echo "required frontend tag ${frontend_tag} is not available" >&2
            exit 1
          fi
          if [[ "${tag_commit}" != "${RELEASE_COMMIT}" ]]; then
            echo "tag ${frontend_tag} resolves to ${tag_commit}, not ${RELEASE_COMMIT}" >&2
            exit 1
          fi
          if ! frontend_release="$(gh release view "${frontend_tag}" --json tagName,isDraft,isPrerelease 2>/dev/null)"; then
            echo "required frontend release ${frontend_tag} is not public" >&2
            exit 1
          fi
          jq -e \
            --arg tag "${frontend_tag}" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == false' \
            <<< "${frontend_release}" >/dev/null || {
              echo "frontend release ${frontend_tag} has conflicting immutable identity" >&2
              exit 1
            }

      - name: Download and verify existing frontend package assets
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          frontend_tag="web/antd-v6/${RELEASE_VERSION}"
          package_dir="${RUNNER_TEMP}/official-npm-package"
          mkdir -p "${package_dir}"
          release_json="$(gh release view "${frontend_tag}" --json assets)"
          jq -e '
            ([.assets[].name | select(endswith(".tgz"))] | length) == 1 and
            ([.assets[].name | select(. == "admin-web-package.json")] | length) == 1 and
            ([.assets[].name | select(. == "admin-web.spdx.json")] | length) == 1 and
            ([.assets[].name | select(. == "SHA256SUMS.admin-web")] | length) == 1
          ' <<< "${release_json}" >/dev/null
          gh release download "${frontend_tag}" \
            --dir "${package_dir}" \
            --pattern '*.tgz' \
            --pattern 'admin-web-package.json' \
            --pattern 'admin-web.spdx.json' \
            --pattern 'SHA256SUMS.admin-web'
          mapfile -t tarballs < <(find "${package_dir}" -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          tarball="${tarballs[0]}"

          expected_names="$(
            printf '%s\n' \
              "$(basename -- "${tarball}")" \
              admin-web-package.json \
              admin-web.spdx.json | sort
          )"
          actual_names="$(
            awk 'NF == 2 { name=$2; sub(/^\*/, "", name); print name }' \
              "${package_dir}/SHA256SUMS.admin-web" | sort
          )"
          test "${actual_names}" = "${expected_names}"
          (
            cd "${package_dir}"
            sha256sum --strict --check SHA256SUMS.admin-web
          )

          python3 tools/release/verify_admin_web_package.py \
            --tarball "${tarball}" \
            --expected-name '@mss-boot-io/admin-web' \
            --expected-version "${UNPREFIXED_VERSION}" \
            --source-repository "${GITHUB_REPOSITORY}" \
            --source-commit "${RELEASE_COMMIT}" \
            --output "${package_dir}/qualified-admin-web-package.json"
          cmp -- \
            "${package_dir}/qualified-admin-web-package.json" \
            "${package_dir}/admin-web-package.json"
          jq -e \
            --arg version "${UNPREFIXED_VERSION}" \
            --arg commit "${RELEASE_COMMIT}" \
            '.spdxVersion == "SPDX-2.3" and
             .packages[0].name == "@mss-boot-io/admin-web" and
             .packages[0].versionInfo == $version and
             (.documentComment | contains($commit))' \
            "${package_dir}/admin-web.spdx.json" >/dev/null
          {
            echo "tarball=${tarball}"
            echo "evidence=${package_dir}/admin-web-package.json"
          } >> "${GITHUB_OUTPUT}"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install a trusted-publishing capable npm CLI
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@11.19.0
          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              process.exit(1);
            }
          ' "${npm_version}"

      - name: Recheck latest workflow attempts before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release/check_release_runs.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${RELEASE_COMMIT}" \
            --version "${RELEASE_VERSION}" \
            --phase all --timeout-seconds 0

      - name: Reconcile immutable npmjs publication state
        id: npmjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_EVIDENCE: ${{ steps.package.outputs.evidence }}
        run: |
          set -euo pipefail
          package='@mss-boot-io/admin-web'
          expected_integrity="$(jq -er '.artifact.integrity' "${PACKAGE_EVIDENCE}")"
          current_latest="$(npm view "${package}" dist-tags.latest --json --registry=https://registry.npmjs.org | jq -er '.')"
          github_latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          # Numeric comparison, not lexical sorting; unexpected aliases fail closed.
          node -e '
            const stable = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
            const [target, npmLatest, githubLatest] = process.argv.slice(1);
            function parse(value) {
              if (!stable.test(value)) throw new Error("invalid stable alias: " + value);
              return value.split(".").map(BigInt);
            }
            if (!githubLatest.startsWith("v")) throw new Error("invalid GitHub stable tag");
            const wanted = parse(target);
            for (const alias of [npmLatest, githubLatest.replace(/^v/, "")]) {
              const current = parse(alias);
              for (let i = 0; i < 3; i++) {
                if (current[i] > wanted[i]) throw new Error("refusing to move latest backward");
                if (current[i] < wanted[i]) break;
              }
            }
          ' "${UNPREFIXED_VERSION}" "${current_latest}" "${github_latest}"
          metadata_file="${RUNNER_TEMP}/npmjs-version.json"
          error_file="${RUNNER_TEMP}/npmjs-view-error.log"
          if npm view "${package}@${UNPREFIXED_VERSION}" \
              name version gitHead dist.integrity --json \
              --registry=https://registry.npmjs.org \
              > "${metadata_file}" 2> "${error_file}"; then
            jq -e \
              --arg name "${package}" \
              --arg version "${UNPREFIXED_VERSION}" \
              --arg commit "${RELEASE_COMMIT}" \
              --arg integrity "${expected_integrity}" \
              '.name == $name and .version == $version and .gitHead == $commit and
               ."dist.integrity" == $integrity' "${metadata_file}" >/dev/null
            test "${current_latest}" = "${UNPREFIXED_VERSION}"
            echo 'publish=false' >> "${GITHUB_OUTPUT}"
          else
            # A timeout, 401, 403 or registry 5xx must never become permission to publish.
            jq -e '.error.code == "E404"' "${metadata_file}" >/dev/null || {
              echo 'npmjs version lookup failed without an authoritative E404' >&2
              exit 1
            }
            echo 'publish=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish the existing tarball to official npm
        if: steps.npmjs.outputs.publish == 'true'
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          unset NPM_TOKEN NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          npm publish "${PACKAGE_TARBALL}" \
            --access public \
            --tag latest \
            --provenance \
            --registry=https://registry.npmjs.org

      - name: Verify npmjs integrity provenance and immutable identity
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
          PACKAGE_EVIDENCE: ${{ steps.package.outputs.evidence }}
          EXPECTED_LATEST: ${{ env.UNPREFIXED_VERSION }}
        run: |
          set -euo pipefail
          package='@mss-boot-io/admin-web'
          expected_integrity="$(jq -er '.artifact.integrity' "${PACKAGE_EVIDENCE}")"
          published_tarball="${RUNNER_TEMP}/npmjs-published-admin-web.tgz"
          metadata=''
          converged=false
          for attempt in $(seq 1 24); do
            echo "npmjs verification attempt ${attempt}/24"
            if metadata="$(
              npm view "${package}@${UNPREFIXED_VERSION}" \
                name version gitHead dist.integrity dist.tarball dist.attestations --json \
                --registry=https://registry.npmjs.org 2>/dev/null
            )"; then
              if ! jq -e \
                --arg version "${UNPREFIXED_VERSION}" \
                --arg commit "${RELEASE_COMMIT}" \
                --arg integrity "${expected_integrity}" \
                '.name == "@mss-boot-io/admin-web" and .version == $version and .gitHead == $commit and
                 ."dist.integrity" == $integrity and
                 (."dist.tarball" | type == "string" and length > 0)' \
                <<< "${metadata}" >/dev/null; then
                echo 'npmjs returned immutable package metadata that does not match the release asset' >&2
                exit 1
              fi
              if ! jq -e '
                ."dist.attestations".provenance.predicateType as $type |
                $type == null or $type == "https://slsa.dev/provenance/v1"
              ' <<< "${metadata}" >/dev/null; then
                echo 'npmjs returned conflicting provenance metadata' >&2
                exit 1
              fi
              latest="$(
                npm view "${package}" dist-tags.latest --json \
                  --registry=https://registry.npmjs.org 2>/dev/null | jq -er '.'
              )" || latest=''
              # Immutable conflicts fail immediately; provenance and aliases
              # may take a short time to propagate after npm accepts the upload.
              if [[ "${latest}" == "${EXPECTED_LATEST}" ]] && jq -e '
                ."dist.attestations".provenance.predicateType == "https://slsa.dev/provenance/v1" and
                (."dist.attestations".url | type == "string" and length > 0)
              ' <<< "${metadata}" >/dev/null; then
                tarball_url="$(jq -er '."dist.tarball"' <<< "${metadata}")"
                if curl --fail --location --silent --show-error \
                  --output "${published_tarball}" \
                  "${tarball_url}" && \
                  cmp -- "${PACKAGE_TARBALL}" "${published_tarball}"; then
                  converged=true
                  break
                fi
              fi
            fi
            if [[ "${attempt}" == '24' ]]; then
              break
            fi
            sleep 5
          done
          if [[ "${converged}" != 'true' ]]; then
            echo 'npmjs package identity did not converge after bounded verification' >&2
            exit 1
          fi

  promote-github:
    name: promote-github-root-latest
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-auto
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require authorized release operator
        env:
          RELEASE_ACTOR_LOGIN: lwnmengjing
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTOR}" != "${RELEASE_ACTOR_LOGIN}" || "${GITHUB_TRIGGERING_ACTOR}" != "${RELEASE_ACTOR_LOGIN}" ]]; then
            echo "release operations must be initiated and triggered by ${RELEASE_ACTOR_LOGIN}" >&2
            exit 1
          fi

      - name: Validate exact completed npm promotion
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_COMMIT: ${{ needs.publish.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != 'tag' ]]; then
            echo 'GitHub stable alias promotion must run from the exact Root tag' >&2
            exit 1
          fi
          test "${GITHUB_REF_NAME}" = "${RELEASE_VERSION}"
          test "${GITHUB_SHA}" = "${RELEASE_COMMIT}"
          package='@mss-boot-io/admin-web'
          unprefixed_version="${RELEASE_VERSION#v}"
          metadata="$(
            npm view "${package}@${unprefixed_version}" \
              version gitHead dist.integrity dist.attestations --json \
              --registry=https://registry.npmjs.org
          )"
          jq -e \
            --arg version "${unprefixed_version}" \
            --arg commit "${RELEASE_COMMIT}" \
            '.version == $version and .gitHead == $commit and
             (."dist.integrity" | type == "string" and length > 0) and
             ."dist.attestations".provenance.predicateType ==
               "https://slsa.dev/provenance/v1"' \
            <<< "${metadata}" >/dev/null
          test "$(
            npm view "${package}" dist-tags.latest --json \
              --registry=https://registry.npmjs.org | jq -er '.'
          )" = "${unprefixed_version}"

      - name: Promote exact Root release to GitHub Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_COMMIT: ${{ needs.publish.outputs.commit }}
        run: |
          set -euo pipefail
          release_json="$(
            gh release view "${RELEASE_VERSION}" \
              --json tagName,targetCommitish,isDraft,isPrerelease
          )"
          jq -e \
            --arg tag "${RELEASE_VERSION}" \
            --arg commit "${RELEASE_COMMIT}" \
            '.tagName == $tag and .targetCommitish == $commit and
             .isDraft == false and .isPrerelease == false' \
            <<< "${release_json}" >/dev/null
          gh release edit "${RELEASE_VERSION}" --latest=true
          test "$(
            gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name
          )" = "${RELEASE_VERSION}"
